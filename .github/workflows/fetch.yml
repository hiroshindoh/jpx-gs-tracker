name: JPX GS Data Fetcher

on:
  schedule:
    - cron: '0 1,9 * * 1-5'   # JST 10:00と18:00（平日のみ）
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pip install requests openpyxl jpholiday
        run: pip install requests openpyxl jpholiday

      - name: Run python fetch_gs_data.py
        run: python fetch_gs_data.py

      - name: Run git config user.name "github-actions[bot]"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gs_data.json
          git diff --cached --quiet || git commit -m "auto: update gs_data.json"
          git push
